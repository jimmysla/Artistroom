[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# SPA fallback – API routes are served by functions with custom paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------- Security headers ----------
# Strict CSP: only own scripts, no inline/eval, no embedding in foreign frames, no plugins.
# Styles allow 'unsafe-inline' for React style props and the e-mail preview (srcdoc iframe);
# img-src https: is needed for external product/mail image links in the dashboard previews.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

# Private areas and APIs must never show up in search engines.
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/zahlung"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/umfrage"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
